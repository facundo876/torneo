<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Seguimiento en vivo del bracket de eliminación directa del torneo.">
  <title>Bracket del torneo</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-body-tertiary">

  <!-- Barra superior: la página pública no ofrece ninguna acción de edición. -->
  <nav class="navbar bg-body border-bottom">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">🏆 Bracket del torneo</span>
      <span class="navbar-text small">Vista pública · sólo lectura</span>
    </div>
  </nav>

  <main class="container-fluid py-4">

    <header id="encabezado-torneo" class="mb-4"></header>

    <!-- Spinner visible mientras se resuelve la lectura del JSON. -->
    <div id="spinner" class="text-center py-5" role="status">
      <div class="spinner-border text-secondary" aria-hidden="true"></div>
      <p class="mt-3 mb-0 text-body-secondary">Cargando torneo…</p>
    </div>

    <!-- El bracket se desplaza horizontalmente cuando no entra en pantalla. -->
    <div class="bracket-scroll" tabindex="0" aria-label="Bracket del torneo, desplazable horizontalmente">
      <div id="contenedor-bracket"></div>
    </div>

    <!-- Referencia de colores, para que el estado de cada partido se entienda. -->
    <aside class="leyenda mt-4" aria-label="Referencia de colores">
      <span class="leyenda__item"><span class="leyenda__muestra leyenda__muestra--ganador"></span> Ganador</span>
      <span class="leyenda__item"><span class="leyenda__muestra leyenda__muestra--perdedor"></span> Eliminado</span>
      <span class="leyenda__item"><span class="leyenda__muestra leyenda__muestra--pendiente"></span> Pendiente</span>
    </aside>

    <p id="ultima-actualizacion" class="text-body-secondary small mt-3 mb-0"></p>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!--
    Sólo se carga el orquestador público. admin.js, auth.js y github.js no se
    importan desde acá: el código administrativo nunca llega al visitante.
  -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
